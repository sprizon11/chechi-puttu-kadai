workflows:
  # Android — works without Apple account. Download APK from Codemagic artifacts.
  android-workflow:
    name: Chechi Puttu Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.9
      java: 17
    working_directory: chechi_puttu_app
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up Android SDK
        script: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platforms;android-35" \
            "build-tools;35.0.0"
      - name: Build release (APK + Play Store AAB)
        script: |
          flutter build apk --release --no-tree-shake-icons
          flutter build appbundle --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

  # iOS free install — no Apple Developer Program required.
  # Download chechi_puttu_free.ipa from artifacts, then install with Sideloadly
  # on Windows using your free Apple ID (re-sign every ~7 days).
  ios-free-workflow:
    name: Chechi Puttu iOS (Free Install)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.9
      xcode: latest
      cocoapods: default
    working_directory: chechi_puttu_app
    scripts:
      - name: Get Flutter packages
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          rm -rf Pods Podfile.lock Runner.xcworkspace/xcshareddata/swiftpm
          pod install --repo-update
      - name: Build unsigned iOS app
        script: |
          flutter clean
          flutter pub get
          cd ios && pod install && cd ..
          flutter build ios --release --no-codesign
      - name: Package IPA for Sideloadly
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found — searching build/ios..."
            APP_PATH="$(find build/ios -name Runner.app -type d | head -n 1)"
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Could not locate Runner.app after build."
            find build/ios -maxdepth 4 -type d
            exit 1
          fi
          rm -rf Payload chechi_puttu_free.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr chechi_puttu_free.ipa Payload
          rm -rf Payload
          ls -lh chechi_puttu_free.ipa
    artifacts:
      - chechi_puttu_free.ipa

  # iOS — requires App Store Connect API key in Codemagic named exactly: chechi-puttu
  # Also requires Apple Developer Program ($99/year) for Ad Hoc signing.
  ios-workflow:
    name: Chechi Puttu iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: chechi-puttu
    environment:
      flutter: 3.41.9
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.example.chechiPuttuApp
    working_directory: chechi_puttu_app
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or create iOS signing files
        script: |
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            openssl genrsa -out /tmp/ios_distribution_private_key.pem 2048
            export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/ios_distribution_private_key.pem)"
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
